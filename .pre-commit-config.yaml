repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: .venv/bin/ruff check .
        language: system
        pass_filenames: false

      - id: ruff-format
        name: Ruff format
        entry: .venv/bin/ruff format --check .
        language: system
        pass_filenames: false

      - id: mypy
        name: Mypy
        entry: .venv/bin/mypy .
        language: system
        pass_filenames: false